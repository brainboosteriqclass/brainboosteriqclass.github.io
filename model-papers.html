<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Model Papers - Brain Booster</title>

<style>

:root{
 --bg:#f3f4f6;
 --card:#ffffff;
 --brand:#0f172a;
 --accent:#2563eb;
 --line:#e5e7eb;
}

body{
 margin:0;
 font-family:Arial;
 background:var(--bg);
}

header{
 background:var(--brand);
 color:white;
 padding:15px;
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:15px;
}

nav{
 margin-top:10px;
}

nav a{
 color:white;
 text-decoration:none;
 margin-right:10px;
 border:1px solid rgba(255,255,255,0.3);
 padding:6px 10px;
 border-radius:8px;
}

nav a:hover{
 background:rgba(255,255,255,0.2);
}

.box{
 background:white;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.paper{
 padding:12px;
 border:1px solid var(--line);
 border-radius:8px;
 margin-bottom:10px;
 cursor:pointer;
}

.paper:hover{
 background:#eff6ff;
}

iframe{
 width:100%;
 height:700px;
 border:none;
 border-radius:10px;
}

</style>

</head>

<header>

<div class="wrap">

</div>


<div class="paper"
